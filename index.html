<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>秘密のアルバム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding-bottom: 40px;
    }
    header {
      text-align: center;
      padding: 16px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #333;
    }
    h1 { font-size: 1.1rem; }
    main { padding: 15px; max-width: 500px; margin: 0 auto; }
    
    .controls { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn {
      flex: 1;
      text-align: center;
      padding: 14px 8px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      background-color: #0a84ff;
      color: white;
      border: none;
    }
    
    /* アプリ内カメラのモーダル画面 */
    #cameraModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #000;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
    }
    #videoPreview {
      width: 100%;
      height: 70vh;
      object-fit: cover;
    }
    .cam-controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      padding: 10px 20px;
    }
    .shutter-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background-color: #fff;
      border: 4px solid #8e8e93;
      cursor: pointer;
    }
    .record-btn-active {
      background-color: #ff3b30 !important;
      border-radius: 12px !important;
      transform: scale(0.8);
    }
    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }

    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      color: #8e8e93;
      margin-bottom: 15px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .media-card {
      position: relative;
      background-color: #1e1e1e;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .media-card img, .media-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .delete-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 16px;
      line-height: 30px;
      text-align: center;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>

  <header>
    <h1>秘密のアルバム</h1>
  </header>

  <main>
    <div class="controls">
      <button class="btn" onclick="openCamera('image')">📷 写真を撮影</button>
      <button class="btn" style="background-color: #ff453a;" onclick="openCamera('video')">🎥 動画を撮影</button>
    </div>

    <div id="status" class="status-msg"></div>
    <div id="gallery" class="gallery"></div>
  </main>

  <!-- ブラウザ内カメラ画面 -->
  <div id="cameraModal">
    <video id="videoPreview" autoplay playsinline muted></video>
    <div class="cam-controls">
      <button class="close-btn" onclick="closeCamera()">キャンセル</button>
      <button id="shutterBtn" class="shutter-btn"></button>
      <div style="width: 60px;"></div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const galleryEl = document.getElementById("gallery");
    const cameraModal = document.getElementById("cameraModal");
    const videoPreview = document.getElementById("videoPreview");
    const shutterBtn = document.getElementById("shutterBtn");

    let db = null;
    let currentStream = null;
    let mode = 'image'; // 'image' or 'video'
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // IndexedDBのセットアップ
    const req = indexedDB.open("SecretPrivateAlbumDB", 1);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains("items")) {
        database.createObjectStore("items", { keyPath: "id", autoIncrement: true });
      }
    };
    req.onsuccess = (e) => {
      db = e.target.result;
      loadGallery();
    };

    // アプリ内カメラの起動（外部の共有・写真アプリを通さない）
    async function openCamera(selectedMode) {
      mode = selectedMode;
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: mode === 'video'
        }).catch(async () => {
          return await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: mode === 'video'
          });
        });

        videoPreview.srcObject = currentStream;
        cameraModal.style.display = "flex";

        if (mode === 'image') {
          shutterBtn.onclick = takePhoto;
        } else {
          shutterBtn.onclick = toggleRecording;
        }
      } catch (err) {
        alert("カメラの起動に失敗しました。アクセスを許可してください。");
      }
    }

    // カメラの停止と終了
    function closeCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      cameraModal.style.display = "none";
      if (isRecording) stopRecording();
    }

    // 写真撮影（キャンバス経由で直接保存）
    function takePhoto() {
      const canvas = document.createElement("canvas");
      canvas.width = videoPreview.videoWidth;
      canvas.height = videoPreview.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(videoPreview, 0, 0);

      const dataUrl = canvas.toDataURL("image/jpeg", 0.8);
      saveItem("image", dataUrl);
      closeCamera();
    }

    // 動画撮影コントロール
    function toggleRecording() {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    }

    function startRecording() {
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(currentStream);
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: "video/mp4" });
        const reader = new FileReader();
        reader.onload = () => {
          saveItem("video", reader.result);
        };
        reader.readAsDataURL(blob);
      };
      mediaRecorder.start();
      isRecording = true;
      shutterBtn.classList.add("record-btn-active");
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        shutterBtn.classList.remove("record-btn-active");
        closeCamera();
      }
    }

    // 内部データベースへの保存
    function saveItem(type, data) {
      if (!db) return;
      const tx = db.transaction(["items"], "readwrite");
      const store = tx.objectStore("items");
      store.add({
        type: type,
        data: data,
        createdAt: Date.now()
      });
      tx.oncomplete = () => loadGallery();
    }

    // 画面への一覧描画
    function loadGallery() {
      if (!db) return;
      const tx = db.transaction(["items"], "readonly");
      const store = tx.objectStore("items");
      const request = store.getAll();

      request.onsuccess = () => {
        const items = request.result || [];
        galleryEl.innerHTML = "";

        if (items.length === 0) {
          statusEl.textContent = "保存されたデータはありません";
          return;
        } else {
          statusEl.textContent = "";
        }

        items.sort((a, b) => b.id - a.id);

        items.forEach((item) => {
          const card = document.createElement("div");
          card.className = "media-card";

          if (item.type === "image") {
            const img = document.createElement("img");
            img.src = item.data;
            card.appendChild(img);
          } else {
            const video = document.createElement("video");
            video.src = item.data;
            video.controls = true;
            video.playsInline = true;
            card.appendChild(video);
          }

          const delBtn = document.createElement("button");
          delBtn.className = "delete-btn";
          delBtn.innerHTML = "✕";
          delBtn.onclick = () => deleteItem(item.id);
          card.appendChild(delBtn);

          galleryEl.appendChild(card);
        });
      };
    }

    function deleteItem(id) {
      if (!confirm("削除しますか？")) return;
      const tx = db.transaction(["items"], "readwrite");
      const store = tx.objectStore("items");
      store.delete(id);
      tx.oncomplete = () => loadGallery();
    }
  </script>
</body>
</html>
