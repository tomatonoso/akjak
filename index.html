<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>秘密のアルバム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding-bottom: 40px;
      user-select: none;
      -webkit-user-select: none;
    }
    header {
      text-align: center;
      padding: 16px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #333;
    }
    h1 { font-size: 1.1rem; }
    main { padding: 15px; max-width: 500px; margin: 0 auto; }
    
    /* ロック画面 */
    #lockScreen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #121212;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .pass-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .pass-input-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .pass-input {
      width: 48px;
      height: 56px;
      font-size: 1.5rem;
      text-align: center;
      background-color: #1e1e1e;
      border: 2px solid #333;
      border-radius: 8px;
      color: #fff;
    }
    .pass-input:focus {
      border-color: #0a84ff;
      outline: none;
    }
    .error-msg {
      color: #ff453a;
      font-size: 0.85rem;
      height: 20px;
    }

    .controls { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn {
      flex: 1;
      text-align: center;
      padding: 14px 8px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      background-color: #0a84ff;
      color: white;
      border: none;
    }
    
    /* アプリ内カメラ画面 */
    #cameraModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #000;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
    }
    #videoPreview {
      width: 100%;
      height: 70vh;
      object-fit: cover;
    }
    .cam-controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      padding: 10px 20px;
    }
    .shutter-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background-color: #fff;
      border: 4px solid #8e8e93;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .record-btn-active {
      background-color: #ff3b30 !important;
      border-radius: 12px !important;
      transform: scale(0.85);
    }
    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }

    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      color: #8e8e93;
      margin-bottom: 15px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .media-card {
      position: relative;
      background-color: #1e1e1e;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .media-card img, .media-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* 長押しで表示される削除ボタン */
    .delete-btn {
      display: none;
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(255, 59, 48, 0.9);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 16px;
      font-weight: bold;
      line-height: 32px;
      text-align: center;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      animation: popIn 0.2s ease;
    }

    @keyframes popIn {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    .show-delete .delete-btn {
      display: block;
    }
  </style>
</head>
<body>

  <!-- ロック画面 -->
  <div id="lockScreen">
    <div class="pass-title">パスワードを入力</div>
    <div class="pass-input-container">
      <input type="password" class="pass-input" maxlength="1" pattern="\d*" inputmode="numeric" id="p1" autofocus>
      <input type="password" class="pass-input" maxlength="1" pattern="\d*" inputmode="numeric" id="p2">
      <input type="password" class="pass-input" maxlength="1" pattern="\d*" inputmode="numeric" id="p3">
      <input type="password" class="pass-input" maxlength="1" pattern="\d*" inputmode="numeric" id="p4">
    </div>
    <div id="passError" class="error-msg"></div>
  </div>

  <header>
    <h1>秘密のアルバム</h1>
  </header>

  <main>
    <div class="controls">
      <button class="btn" onclick="openCamera('image')">📷 写真を撮影</button>
      <button class="btn" style="background-color: #ff453a;" onclick="openCamera('video')">🎥 動画を撮影</button>
    </div>

    <div id="status" class="status-msg"></div>
    <div id="gallery" class="gallery"></div>
  </main>

  <div id="cameraModal">
    <video id="videoPreview" autoplay playsinline muted></video>
    <div class="cam-controls">
      <button class="close-btn" onclick="closeCamera()">キャンセル</button>
      <button id="shutterBtn" class="shutter-btn"></button>
      <div style="width: 60px;"></div>
    </div>
  </div>

  <script>
    const CORRECT_PASS = "1104";
    const passInputs = [document.getElementById("p1"), document.getElementById("p2"), document.getElementById("p3"), document.getElementById("p4")];
    const passError = document.getElementById("passError");
    const lockScreen = document.getElementById("lockScreen");

    // パスワード入力の挙動設定
    passInputs.forEach((input, index) => {
      input.addEventListener("input", (e) => {
        if (e.target.value.length === 1) {
          if (index < 3) {
            passInputs[index + 1].focus();
          } else {
            checkPassword();
          }
        }
      });

      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !e.target.value && index > 0) {
          passInputs[index - 1].focus();
        }
      });
    });

    function checkPassword() {
      const enteredPass = passInputs.map(input => input.value).join("");
      if (enteredPass === CORRECT_PASS) {
        lockScreen.style.display = "none";
        initApp();
      } else {
        passError.textContent = "パスワードが違います";
        passInputs.forEach(input => input.value = "");
        passInputs[0].focus();
      }
    }

    const statusEl = document.getElementById("status");
    const galleryEl = document.getElementById("gallery");
    const cameraModal = document.getElementById("cameraModal");
    const videoPreview = document.getElementById("videoPreview");
    const shutterBtn = document.getElementById("shutterBtn");

    let db = null;
    let currentStream = null;
    let mode = 'image';
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // パスワード通過後に起動
    function initApp() {
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist();
      }

      const req = indexedDB.open("SecretPersistentDB_v3", 1);
      req.onupgradeneeded = (e) => {
        const database = e.target.result;
        if (!database.objectStoreNames.contains("items")) {
          database.createObjectStore("items", { keyPath: "id", autoIncrement: true });
        }
      };
      req.onsuccess = (e) => {
        db = e.target.result;
        loadGallery();
      };
      req.onerror = () => {
        statusEl.textContent = "データベースの接続に失敗しました";
      };
    }

    async function openCamera(selectedMode) {
      mode = selectedMode;
      try {
        const constraints = {
          video: { facingMode: { ideal: "environment" } },
          audio: mode === 'video'
        };
        
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoPreview.srcObject = currentStream;
        cameraModal.style.display = "flex";

        if (mode === 'image') {
          shutterBtn.classList.remove("record-btn-active");
          shutterBtn.onclick = takePhoto;
        } else {
          shutterBtn.onclick = toggleRecording;
        }
      } catch (err) {
        alert("カメラの許可が必要です。");
      }
    }

    function closeCamera() {
      if (isRecording) stopRecording();
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      cameraModal.style.display = "none";
    }

    function takePhoto() {
      const canvas = document.createElement("canvas");
      canvas.width = videoPreview.videoWidth;
      canvas.height = videoPreview.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(videoPreview, 0, 0);

      canvas.toBlob((blob) => {
        saveItem("image", blob);
        closeCamera();
      }, "image/jpeg", 0.85);
    }

    function toggleRecording() {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    }

    function startRecording() {
      recordedChunks = [];
      let mimeType = 'video/webm';
      if (MediaRecorder.isTypeSupported('video/mp4')) {
        mimeType = 'video/mp4';
      }

      mediaRecorder = new MediaRecorder(currentStream, { mimeType });
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: mimeType });
        saveItem("video", blob);
      };

      mediaRecorder.start();
      isRecording = true;
      shutterBtn.classList.add("record-btn-active");
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        shutterBtn.classList.remove("record-btn-active");
        closeCamera();
      }
    }

    function saveItem(type, blobData) {
      if (!db) return;
      statusEl.textContent = "保存中...";
      
      const tx = db.transaction(["items"], "readwrite");
      const store = tx.objectStore("items");
      
      store.add({
        type: type,
        blob: blobData,
        createdAt: Date.now()
      });

      tx.oncomplete = () => {
        statusEl.textContent = "";
        loadGallery();
      };
      
      tx.onerror = () => {
        statusEl.textContent = "保存に失敗しました";
      };
    }

    function loadGallery() {
      if (!db) return;
      const tx = db.transaction(["items"], "readonly");
      const store = tx.objectStore("items");
      const request = store.getAll();

      request.onsuccess = () => {
        const items = request.result || [];
        galleryEl.innerHTML = "";

        if (items.length === 0) {
          statusEl.textContent = "保存されたデータはありません";
          return;
        } else {
          statusEl.textContent = "";
        }

        items.sort((a, b) => b.id - a.id);

        items.forEach((item) => {
          const card = document.createElement("div");
          card.className = "media-card";

          const blobUrl = URL.createObjectURL(item.blob);

          if (item.type === "image") {
            const img = document.createElement("img");
            img.src = blobUrl;
            card.appendChild(img);
          } else {
            const video = document.createElement("video");
            video.src = blobUrl;
            video.controls = true;
            video.playsInline = true;
            card.appendChild(video);
          }

          const delBtn = document.createElement("button");
          delBtn.className = "delete-btn";
          delBtn.innerHTML = "✕";
          delBtn.onclick = (e) => {
            e.stopPropagation();
            deleteItem(item.id);
          };
          card.appendChild(delBtn);

          let pressTimer;

          const startPress = () => {
            pressTimer = setTimeout(() => {
              card.classList.add("show-delete");
            }, 500);
          };

          const cancelPress = () => {
            clearTimeout(pressTimer);
          };

          card.addEventListener("touchstart", startPress, { passive: true });
          card.addEventListener("touchend", cancelPress);
          card.addEventListener("touchmove", cancelPress);

          card.addEventListener("mousedown", startPress);
          card.addEventListener("mouseup", cancelPress);
          card.addEventListener("mouseleave", cancelPress);

          galleryEl.appendChild(card);
        });
      };
    }

    function deleteItem(id) {
      if (!confirm("このデータを削除しますか？")) return;
      const tx = db.transaction(["items"], "readwrite");
      const store = tx.objectStore("items");
      store.delete(id);
      tx.oncomplete = () => loadGallery();
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".media-card")) {
        document.querySelectorAll(".media-card").forEach(card => {
          card.classList.remove("show-delete");
        });
      }
    });
  </script>
</body>
</html>
      }
    });
  </script>
</body>
</html>
